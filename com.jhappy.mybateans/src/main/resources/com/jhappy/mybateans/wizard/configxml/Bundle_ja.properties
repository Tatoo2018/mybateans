MyBatisConfigXmlVisualPanel.txtaTManagerTypeDesctiption.text=JDBC \u2013 JDBC \u6a19\u6e96\u306e\u30b3\u30df\u30c3\u30c8\u30fb\u30ed\u30fc\u30eb\u30d0\u30c3\u30af\u6a5f\u80fd\u3092\u76f4\u63a5\u5229\u7528\u3057\u307e\u3059\u3002\u30c7\u30fc\u30bf\u30bd\u30fc\u30b9\u304b\u3089\u53d6\u5f97\u3057\u305f\u63a5\u7d9a\u306b\u4f9d\u5b58\u3057\u3066\u30c8\u30e9\u30f3\u30b6\u30af\u30b7\u30e7\u30f3\u306e\u30b9\u30b3\u30fc\u30d7\u3092\u7ba1\u7406\u3057\u307e\u3059\u3002\u4e00\u90e8\u306e\u30c9\u30e9\u30a4\u30d0\u3068\u306e\u4e92\u63db\u6027\u3092\u4fdd\u3064\u305f\u3081\u3001\u30c7\u30d5\u30a9\u30eb\u30c8\u3067\u306f\u63a5\u7d9a\u3092\u9589\u3058\u308b\u969b\u306b\u30aa\u30fc\u30c8\u30b3\u30df\u30c3\u30c8\u3092\u6709\u52b9\u306b\u3057\u307e\u3059\u3002\n\nMANAGED \u2013 MyBatis \u5074\u3067\u306f\u307b\u3068\u3093\u3069\u4f55\u3082\u3057\u307e\u305b\u3093\u3002\u63a5\u7d9a\u306e\u30b3\u30df\u30c3\u30c8\u3084\u30ed\u30fc\u30eb\u30d0\u30c3\u30af\u306f\u884c\u308f\u305a\u3001\u30b3\u30f3\u30c6\u30ca\uff08JEE \u30a2\u30d7\u30ea\u30b1\u30fc\u30b7\u30e7\u30f3\u30b5\u30fc\u30d0\u30fc\u306a\u3069\uff09\u306b\u30c8\u30e9\u30f3\u30b6\u30af\u30b7\u30e7\u30f3\u306e\u30e9\u30a4\u30d5\u30b5\u30a4\u30af\u30eb\u7ba1\u7406\u3092\u5b8c\u5168\u306b\u59d4\u306d\u307e\u3059\u3002\u30c7\u30d5\u30a9\u30eb\u30c8\u3067\u306f\u3001\u63a5\u7d9a\u3092\u9589\u3058\u308b\u51e6\u7406\u306e\u307f\u884c\u3044\u307e\u3059\u3002