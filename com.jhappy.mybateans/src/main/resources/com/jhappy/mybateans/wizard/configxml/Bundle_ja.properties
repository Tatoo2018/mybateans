MyBatisConfigXmlVisualPanel.txtaDataSourceDescription.text=UNPOOLED \u2013 \u30ea\u30af\u30a8\u30b9\u30c8\u306e\u305f\u3073\u306b\u63a5\u7d9a\u3092\u958b\u9589\u3057\u307e\u3059\u3002\u4f4e\u901f\u3067\u3059\u304c\u3001\u5373\u6642\u306e\u63a5\u7d9a\u30d1\u30d5\u30a9\u30fc\u30de\u30f3\u30b9\u3092\u5fc5\u8981\u3068\u3057\u306a\u3044\u30b7\u30f3\u30d7\u30eb\u306a\u30a2\u30d7\u30ea\u306b\u9069\u3057\u3066\u3044\u307e\u3059\u3002\n\nPOOLED \u2013 JDBC\u63a5\u7d9a\u30aa\u30d6\u30b8\u30a7\u30af\u30c8\u3092\u30d7\u30fc\u30eb\u3057\u3001\u65b0\u898f\u4f5c\u6210\u6642\u306e\u8a8d\u8a3c\u6642\u9593\u3092\u56de\u907f\u3057\u307e\u3059\u3002\u540c\u6642\u5b9f\u884c\u6570\u304c\u591a\u3044Web\u30a2\u30d7\u30ea\u3067\u9ad8\u901f\u306a\u30ec\u30b9\u30dd\u30f3\u30b9\u3092\u5f97\u308b\u305f\u3081\u306e\u4e00\u822c\u7684\u306a\u624b\u6cd5\u3067\u3059\u3002\n\nJNDI \u2013 EJB\u3084\u30a2\u30d7\u30ea\u30b5\u30fc\u30d0\u30fc\u306a\u3069\u306e\u30b3\u30f3\u30c6\u30ca\u304c\u30c7\u30fc\u30bf\u30bd\u30fc\u30b9\u3092\u5916\u90e8\u3067\u4e00\u62ec\u7ba1\u7406\u3057\u3001JNDI\u30b3\u30f3\u30c6\u30ad\u30b9\u30c8\u306b\u53c2\u7167\u3092\u914d\u7f6e\u3059\u308b\u5834\u5408\u306b\u4f7f\u7528\u3057\u307e\u3059\u3002
