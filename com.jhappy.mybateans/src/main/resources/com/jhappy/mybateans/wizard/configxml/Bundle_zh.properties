MyBatisConfigXmlVisualPanel.txtaTManagerTypeDesctiption.text=JDBC \u2013 \u76f4\u63a5\u5229\u7528 JDBC \u7684\u63d0\u4ea4\u548c\u56de\u6eda\u8bbe\u65bd\u3002\u5b83\u4f9d\u8d56\u4e8e\u4ece\u6570\u636e\u6e90\u83b7\u53d6\u7684\u8fde\u63a5\u6765\u7ba1\u7406\u4e8b\u52a1\u7684\u4f5c\u7528\u57df\u3002\u4e3a\u4e86\u4e0e\u67d0\u4e9b\u9a71\u52a8\u7a0b\u5e8f\u4fdd\u6301\u517c\u5bb9\uff0c\u9ed8\u8ba4\u60c5\u51b5\u4e0b\u5b83\u5728\u5173\u95ed\u8fde\u63a5\u65f6\u542f\u7528\u81ea\u52a8\u63d0\u4ea4\u3002\n\nMANAGED \u2013 MyBatis \u672c\u8eab\u51e0\u4e4e\u4e0d\u6267\u884c\u4efb\u4f55\u64cd\u4f5c\u3002\u5b83\u4ece\u4e0d\u63d0\u4ea4\u6216\u56de\u6eda\u8fde\u63a5\uff0c\u800c\u662f\u8ba9\u5bb9\u5668\uff08\u5982 JEE \u5e94\u7528\u670d\u52a1\u5668\uff09\u6765\u7ba1\u7406\u4e8b\u52a1\u7684\u6574\u4e2a\u751f\u547d\u5468\u671f\u3002\u9ed8\u8ba4\u60c5\u51b5\u4e0b\uff0c\u5b83\u4f1a\u6267\u884c\u5173\u95ed\u8fde\u63a5\u7684\u64cd\u4f5c\u3002